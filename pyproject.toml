[project]
name = "triagedesk"
version = "0.1.0"
description = "Agentic triage-support tool: vitals + presenting complaint -> sourced, SATS-grounded priority"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp[cli]==2.3.0",
    "langgraph==1.2.14",
    "langchain[mcp]==1.4.4",
    "langgraph-checkpoint-sqlite==3.1.1",
    "ollama==0.6.3",
    "pydantic==2.14.0",
    "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.14",
]

[project.scripts]
triagedesk = "triagedesk.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triagedesk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "TID"]

# Belt-and-braces for the D-13 purity boundary: a forbidden import is also
# caught at lint time. The AST test (tests/test_purity.py) is authoritative.
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"triagedesk.llm".msg = "core/ must not depend on the model (D-13)"
"triagedesk.mcp".msg = "core/ must not depend on MCP (D-13)"
"triagedesk.store".msg = "core/ must not depend on storage (D-13)"

# TID251 (banned-api) enforces "core/ imports nothing from llm|mcp|store".
# Other layers may depend on those modules legitimately (e.g. mcp/server.py ->
# llm/client.py), so the ban is scoped to core/ by disabling TID251 elsewhere.
[tool.ruff.lint.per-file-ignores]
"src/triagedesk/llm/**" = ["TID251"]
# The extraction prompt is a human-readable template: its lines are deliberately long,
# so the line-length rule does not apply (the prompt bytes are the artefact, SAFE-04).
"src/triagedesk/llm/prompts.py" = ["E501"]
"src/triagedesk/mcp/**" = ["TID251"]
"src/triagedesk/graph/**" = ["TID251"]
"src/triagedesk/store/**" = ["TID251"]
"src/triagedesk/evals/**" = ["TID251"]
"src/triagedesk/demo/**" = ["TID251"]
"scripts/**" = ["TID251"]
"tests/**" = ["TID251"]

[tool.mypy]
python_version = "3.12"
strict = true
