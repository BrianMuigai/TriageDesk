[project]
name = "triagedesk"
version = "0.1.0"
description = "Agentic triage-support tool: vitals + presenting complaint -> sourced, SATS-grounded priority"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mcp[cli]==2.3.0",
    "langgraph==1.2.14",
    "langchain[mcp]==1.4.4",
    "langgraph-checkpoint-sqlite==3.1.1",
    "ollama==0.6.3",
    "pydantic==2.14.0",
    "pyyaml>=6.0,<7",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.9",
    "mypy>=1.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/triagedesk"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
