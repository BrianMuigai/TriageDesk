# Adult clinical discriminators — the machine authority (D-08, D-11, INTAKE-05).
#
# Source: SATS Training Manual 2012, Emergency Medicine Society of South Africa
# (EMSSA) — <https://emssa.org.za>. Discriminators override the TEWS colour; the
# most urgent category present wins (docs/SATS.md §5).
#
# This file is the single source of truth for discriminator -> category -> colour
# and for the alias lists used by the deterministic matcher (D-11). It is read
# ONLY through `src/triagedesk/core/rules.py`; no discriminator string, category
# or citation may be inlined in code (CONVENTIONS §1).
#
# Kept to functional facts: ids, short labels and aliases — no manual prose
# (Pitfall 5). Alias lists are authored (agent discretion); they are deliberately
# broad enough to cover the complaint phrasing in the Phase-4 eval cases, but
# "feeling unwell" is intentionally absent: E-09 is the declared coverage-gap
# failure and must NOT be tuned green (EVALS §6, Pitfall 11).
version: 1
citation: "SATS Training Manual 2012 (EMSSA), adult clinical discriminators"

# Category -> resulting colour and the manual table it is transcribed from.
categories:
  emergency:
    colour: RED
    citation_ref: "SATS Table: Emergency discriminators"
  very_urgent:
    colour: ORANGE
    citation_ref: "SATS Table: Very urgent discriminators"
  urgent:
    colour: YELLOW
    citation_ref: "SATS Table: Urgent discriminators"

# Every adult discriminator from docs/SATS.md §5 — one entry each.
discriminators:
  # --- Emergency (-> RED) ------------------------------------------------- #
  - id: obstructed_airway
    category: emergency
    label: "Obstructed airway — not breathing"
    aliases: ["obstructed airway", "airway obstruction", "not breathing", "no breathing", "choking", "apnoea", "apnea"]
  - id: seizure_current
    category: emergency
    label: "Seizure — current"
    aliases: ["active seizure", "current seizure", "seizure now", "convulsing", "convulsion", "status epilepticus", "fitting", "ongoing seizure"]
  - id: burn_facial_inhalation
    category: emergency
    label: "Burn — facial / inhalation"
    aliases: ["facial burn", "burn to face", "inhalation burn", "inhalation injury", "airway burn", "singed nose", "singed eyebrows"]
  - id: hypoglycaemia
    category: emergency
    label: "Hypoglycaemia — glucose < 3 mmol/L"
    aliases: ["hypoglycaemia", "hypoglycemia", "low blood sugar", "low glucose", "glucose below 3", "hypo"]
  - id: cardiac_arrest
    category: emergency
    label: "Cardiac arrest"
    aliases: ["cardiac arrest", "no pulse", "heart stopped", "cardiopulmonary arrest", "cpr in progress"]
  - id: avpu_pain_or_unresponsive
    category: emergency
    label: "AVPU responds only to pain or unresponsive"
    aliases: ["responds only to pain", "only responds to pain", "responds to pain only", "unresponsive", "unconscious", "not responsive"]
  - id: confusion
    category: emergency
    label: "Confusion"
    aliases: ["confusion", "confused", "disoriented", "disorientated", "delirious"]

  # --- Very urgent (-> ORANGE) -------------------------------------------- #
  - id: high_energy_transfer
