# The explicit 'nothing matched' outcome (D-11): a deterministic matcher must be
# able to report a coverage gap rather than silently returning a low-acuity colour.
no_match:
  result: none
  warning: "no discriminator matched — coverage gap (E-09); do not infer a colour from the complaint"
