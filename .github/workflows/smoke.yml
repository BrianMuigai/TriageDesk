# The demo smoke test (DOCS-03, D-02, T-05-04): the exact one-command path a stranger runs.
#
# This job runs the EXACT bare `uv run triagedesk demo` command — offline by default, so
# it needs only `uv` and the locked dependencies (no pulled model, no borrowed server). A
# broken one-command path therefore fails the build rather than sitting in a document. The
# setup mirrors `eval-gate.yml` and adds NO dependency; the offline demo is fully
# in-process, so the borrowed `npx mcp-sqlite` server is never launched (T-05-10, T-05-SC).
#
# Triggers: every pull request into `main`, plus manual dispatch. The original post-freeze
# workflow_dispatch-only rule applied to the frozen `v1.0-submission` tag; post-submission
# work is reviewed through PRs, so the smoke path gates those PRs.
name: smoke

on:
  workflow_dispatch:
  pull_request:
    branches: [main]

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install Python 3.12
        run: uv python install 3.12

      - name: Install the locked dependencies
        run: uv sync --locked

      - name: Demo smoke (the exact one-command path, offline)
        run: uv run triagedesk demo
