<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TriageDesk — triage desk</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<a class="skip-link" href="#main">Skip to main content</a>
<div class="app-shell">
  <aside class="rail" aria-label="Desk navigation">
    <a class="brand" href="/" aria-label="TriageDesk home">
      <span class="brand-mark" aria-hidden="true">TD</span>
      <span class="brand-copy"><strong>TriageDesk</strong><small>OPD triage desk</small></span>
    </a>
    <nav class="desk-nav" aria-label="Desk pages">
      <a href="/" class="nav-link"$new_case_current>New case</a>
      <a href="/waiting" class="nav-link"$waiting_current>Waiting room</a>
      <a href="/system" class="nav-link"$system_current>System map</a>
    </nav>
    <div class="rail-card">
      <p class="rail-eyebrow">$rail_station_eyebrow</p>
      <p class="rail-title">$rail_station_title</p>
      <p class="rail-copy">$rail_station_body</p>
    </div>
    <p class="rail-foot">$rail_foot</p>
  </aside>
  <div class="app-main">
    <header class="topbar">
      <div class="topbar-title">
        <p class="eyebrow">$page_eyebrow</p>
        <h1>$page_title</h1>
      </div>
      <div class="topbar-meta">
        <span class="mode-pill"><span class="mode-dot" aria-hidden="true"></span><span class="mode-label">$mode_label</span></span>
        $topbar_action
      </div>
    </header>
    <main id="main" class="page">
$workspace
    </main>
  </div>
</div>
<script>
(function () {
  var form = document.getElementById('vitals-form');
  if (form) {
    var formSubmitted = false;
    // Precompute: when the complaint text changes, ask the server to start the online
    // extraction in the background while the nurse finishes the vitals. Same-origin,
    // relative path, the form's own fields (including the CSRF token), and failures are
    // ignored — the endpoint is a no-op offline, and a submit still works without it.
    var complaint = document.getElementById('complaint');
    if (complaint) {
      complaint.addEventListener('change', function () {
        fetch('/precompute', {
          method: 'POST',
          body: new URLSearchParams(new FormData(form))
        }).catch(function () {});
      });
    }
    form.addEventListener('submit', function (event) {
      if (formSubmitted) { event.preventDefault(); return; }
      formSubmitted = true;
      var submitter = event && event.submitter ? event.submitter : null;
      if (submitter && submitter.getAttribute('value') === 'note') {
        // Keep the submitter enabled: a disabled submit button is not a "successful
        // control", so its name=action value=note would be dropped and the desk would run
        // the case instead of reading the note.
        submitter.setAttribute('aria-busy', 'true');
        submitter.textContent = 'Reading the note…';
        return;
      }
      var button = document.getElementById('submit-vitals');
      if (!button) { return; }
      // Keep the submitter enabled for the same reason: its name=action value=confirm is
      // the human checkpoint. Disabling it would drop the action and score the case early.
      button.setAttribute('aria-busy', 'true');
      button.textContent = 'Checking the details…';
    });
    var reset = form.querySelector('button[type="reset"]');
    if (reset) {
      reset.addEventListener('click', function (event) {
        if (!window.confirm(reset.getAttribute('data-confirm'))) {
          event.preventDefault();
        }
      });
    }
  }

  // The composer is associated with the vitals form (it sits outside it visually). A
  // Ctrl/Cmd+Enter sends the note; a plain Enter keeps the newline a textarea expects.
  var note = document.getElementById('note-input');
  if (note) {
    note.addEventListener('keydown', function (event) {
      if (event.key === 'Enter' && (event.ctrlKey || event.metaKey)) {
        event.preventDefault();
        var send = document.querySelector('.composer-send');
        if (send) { send.click(); }
      }
    });
  }

  // The gate: a decision in flight disables the submit controls so no second decision is
  // possible; the deadline timer reveals the timeout panel WITHOUT submitting anything, so
  // a timeout defaults to no approve (D10-10). The bridge holds no server-side deadline:
  // a timeout is simply "no decision POST ever arrives".
  //
  // The SUBMITTER must stay enabled: a disabled submit button is not a "successful control",
  // so disabling the clicked button inside its own `submit` handler drops its
  // `name=decision value=approve|edit|dismiss` from the form data set and the decision never
  // reaches the server. Disable only the SIBLINGS, and block a second decision with a flag.
  var gate = document.getElementById('approval-gate-form');
  if (gate) {
    var gateButtons = gate.querySelectorAll('button');
    var disableGate = function (submitter) {
      for (var i = 0; i < gateButtons.length; i++) {
        if (gateButtons[i] !== submitter) { gateButtons[i].disabled = true; }
      }
    };
    var gateSubmitted = false;
    gate.addEventListener('submit', function (event) {
      if (gateSubmitted) { event.preventDefault(); return; }
      gateSubmitted = true;
      var submitter = event && event.submitter ? event.submitter : null;
      // The colour radios belong to the edit disclosure. An approve must never carry a
      // stale selection; the server also refuses one as a fail-closed backstop.
      if (submitter && submitter.getAttribute('value') === 'approve') {
        var radios = gate.querySelectorAll('.colour-choices input');
        for (var j = 0; j < radios.length; j++) { radios[j].checked = false; }
      }
      disableGate(submitter);
    });
    var gateDeadlineMs = 5 * 60 * 1000;
    window.setTimeout(function () {
      disableGate(null);
      var panel = document.getElementById('gate-timeout');
      if (panel) { panel.hidden = false; }
    }, gateDeadlineMs);
  }

  // The question panel: a QUESTION, not a decision. Same double-submit guard as the gate
  // (disable the siblings, keep the clicked submitter so its name/action still posts) but no
  // deadline timer — a question has no timeout, and the decline control is always available.
  var question = document.getElementById('clarification-form');
  if (question) {
    var questionButtons = question.querySelectorAll('button');
    var questionSubmitted = false;
    question.addEventListener('submit', function (event) {
      if (questionSubmitted) { event.preventDefault(); return; }
      questionSubmitted = true;
      var submitter = event && event.submitter ? event.submitter : null;
      for (var i = 0; i < questionButtons.length; i++) {
        if (questionButtons[i] !== submitter) { questionButtons[i].disabled = true; }
      }
    });
  }
})();
</script>
</body>
</html>
