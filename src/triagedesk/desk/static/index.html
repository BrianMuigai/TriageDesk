<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TriageDesk — triage desk</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>
<h1>TriageDesk — triage desk</h1>

<section class="quickstart-panel" aria-labelledby="quickstart-heading">
  <h2 id="quickstart-heading">Start here</h2>
  <p class="quickstart-steps">1. Enter the vitals and the complaint. 2. Choose Get suggested priority. 3. Check the suggestion and its evidence. 4. Approve, edit, or dismiss — nothing is committed until you do.</p>
</section>

<form id="vitals-form" class="vitals-form" method="post" action="/case">
  <h2>Patient vitals</h2>
  $csrf_field
  $vitals_fields
  <div class="form-actions">
    <button type="submit" id="submit-vitals" class="primary">Get suggested priority</button>
    <button type="reset" class="destructive" data-confirm="Clear form: this removes the vitals you have typed. Clear the form?">Clear form</button>
  </div>
</form>

$state_panel
<div class="uncertainty-banner" aria-live="polite">$banner</div>
$card
$gate
</main>
<script>
(function () {
  var form = document.getElementById('vitals-form');
  if (form) {
    form.addEventListener('submit', function () {
      var button = document.getElementById('submit-vitals');
      if (!button) { return; }
      button.disabled = true;
      button.setAttribute('aria-busy', 'true');
      button.textContent = 'Getting the suggested priority…';
    });
    var reset = form.querySelector('button[type="reset"]');
    if (reset) {
      reset.addEventListener('click', function (event) {
        if (!window.confirm(reset.getAttribute('data-confirm'))) {
          event.preventDefault();
        }
      });
    }
  }

  // The gate: a decision in flight disables the submit controls so no second decision is
  // possible; the deadline timer reveals the timeout panel WITHOUT submitting anything, so
  // a timeout defaults to no approve (D10-10). The bridge holds no server-side deadline:
  // a timeout is simply "no decision POST ever arrives".
  //
  // The SUBMITTER must stay enabled: a disabled submit button is not a "successful control",
  // so disabling the clicked button inside its own `submit` handler drops its
  // `name=decision value=approve|edit|dismiss` from the form data set and the decision never
  // reaches the server. Disable only the SIBLINGS, and block a second decision with a flag.
  var gate = document.getElementById('approval-gate-form');
  if (gate) {
    var gateButtons = gate.querySelectorAll('button');
    var disableGate = function (submitter) {
      for (var i = 0; i < gateButtons.length; i++) {
        if (gateButtons[i] !== submitter) { gateButtons[i].disabled = true; }
      }
    };
    var gateSubmitted = false;
    gate.addEventListener('submit', function (event) {
      if (gateSubmitted) { event.preventDefault(); return; }
      gateSubmitted = true;
      disableGate(event && event.submitter ? event.submitter : null);
    });
    var gateDeadlineMs = 5 * 60 * 1000;
    window.setTimeout(function () {
      disableGate(null);
      var panel = document.getElementById('gate-timeout');
      if (panel) { panel.hidden = false; }
    }, gateDeadlineMs);
  }
})();
</script>
</body>
</html>
